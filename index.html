<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily AI News Digest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh;
         display: flex; justify-content: center; align-items: center; }
  .card { max-width: 480px; text-align: center; padding: 2rem; }
  .cover { width: 200px; height: 200px; border-radius: 16px;
           box-shadow: 0 8px 32px rgba(0,0,0,.4); margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin-bottom: .5rem; }
  p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
  .rss-link { display: inline-block; background: #f97316; color: #fff;
              text-decoration: none; padding: .75rem 1.5rem; border-radius: 8px;
              font-weight: 600; transition: background .2s; }
  .rss-link:hover { background: #ea580c; }
  .sub { margin-top: 1.5rem; color: #64748b; font-size: .85rem; line-height: 1.8; }
  .sub a { color: #60a5fa; text-decoration: none; }
  code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: .85rem;
         word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <img src="cover.jpg" alt="Daily AI News Digest" class="cover">
  <h1>Daily AI News Digest</h1>
  <p>매일 아침 AI가 선별·요약한 국내외 주요 뉴스를<br>한국어 음성으로 전달합니다.</p>
  <a class="rss-link" href="feed.xml">RSS Feed 구독</a>
  <div class="sub">
    <p>팟캐스트 앱에서 아래 URL을 추가하세요:</p>
    <code>https://isoprox99.github.io/daily-ai-news-podcast/feed.xml</code>
    <p style="margin-top:1rem">
      <a href="https://podcasts.apple.com/podcast/feed/https://isoprox99.github.io/daily-ai-news-podcast/feed.xml">Apple Podcasts</a>
    </p>
  </div>
</div>
</body>
</html>
